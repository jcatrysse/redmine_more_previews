pt:
  project_module_redmine_more_previews:                    "Redmine More Previews"
  label_redmine_more_previews:                             "Redmine More Previews"
  
  label_redmine_more_previews_global_settings:             "Configurações globais"
  
  text_more_previews_embed_setting:                        "Embutir a visualização na página de visualização"
  text_more_previews_use_object_embed:                     "em <objecto>>embed>-tag"
  text_more_previews_use_iframe:                           "em < se for de >-tag"
  text_help_redmine_more_previews_embed_settings:          "A opção <objeto>-tag com retorno para <embed>-tag não é HTML válido, mas funciona na maioria dos navegadores, incluindo navegadores mais antigos. A opção <iframe>-tag é HTML válida."
  
  label_use_cache:                                         "Cache"
  text_more_previews_cache:                                "Caching da visualização gerada"
  text_help_redmine_more_previews_cache:                   "O cache torna a exibição repetida de visualizações muito mais rápida, mas pode inchar o diretório /tmp no diretório raiz da Redmine."
  text_more_previews_limits:                             "Limites de conversão"
  label_conversion_timeout:                              "Limite de tempo (segundos)"
  label_lock_timeout:                                    "Limite de espera (segundos)"
  label_max_conversions:                                 "Conversões simultâneas"
  label_max_repository_file:                             "Maior ficheiro de repositório (MiB)"
  label_max_output:                                      "Maior visualização servida (MiB)"
  label_max_cache:                                       "Tamanho da cache (MiB)"
  label_failure_ttl:                                     "Falhas lembradas durante (minutos)"
  text_help_redmine_more_previews_limits:                "Uma conversão que dure mais do que o limite de tempo é parada com todos os programas que iniciou (o Libre recebe pelo menos 120 segundos). Um pedido recebe 503 (tente mais tarde) quando todas as conversões, contadas em todos os processos da Redmine, estão ocupadas, ou quando espera mais do que o limite de espera por uma visualização que está a ser gerada. Um ficheiro de repositório ou uma visualização maior do que o seu limite é respondido com 413. Quando a cache ultrapassa o seu tamanho, as novas visualizações são convertidas a cada pedido e não são guardadas. Uma conversão que falhou não é tentada de novo enquanto é lembrada, até que um administrador recarregue a visualização. Recarregar e a visualização não segura de e-mails são só para administradores."
  text_more_previews_busy:                               "A visualização está a ser gerada ou o servidor está ocupado. Tente novamente mais tarde."
  text_more_previews_too_large:                          "O ficheiro é demasiado grande para uma visualização."
  error_more_previews_invalid_libre_format:              "Formato de conversão do LibreOffice inválido; as definições não foram guardadas."
  
  label_redmine_more_previews_plugins_settings:            "Configurações dos Plugins"
  
  button_unsafe_update:                                    "Atualização insegura"
  
  label_debug:                                             "Debug"
  text_help_redmine_more_previews_debug:                   "Mostrar informações de debug em vez de um arquivo convertido"
  
  label_use_absolute_path:                                 "URL com host"
  text_help_redmine_more_previews_absolute:                "(usar URL com esquema e host) para <iframe>-tag ou <embed>-tag"